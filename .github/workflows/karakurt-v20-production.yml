name: Karakurt v20 Production

on:
  workflow_dispatch:
  push:
    branches: [karakurt-online]
    paths:
      - 'karakurt-online/v20-pack/**'
      - '.github/workflows/karakurt-v20-production.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_UKcLHeA8OTQuL4BxiVVfbpqI
      VERCEL_PROJECT_ID: prj_0Im1A1dwKSvmPivgdSKyL6QxQAm9
    steps:
      - uses: actions/checkout@v4

      - name: Verify Vercel token
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo 'VERCEL_TOKEN_MISSING'
            exit 2
          fi

      - name: Rebuild v20 HTML
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/karakurt-deploy/api /tmp/karakurt-deploy/.vercel
          cat karakurt-online/v20-pack/pack-*.txt | tr -d '\r\n' | base64 -d | gzip -dc > /tmp/karakurt-deploy/index.html
          grep -q 'ENGINE v20.0 PUBLISH' /tmp/karakurt-deploy/index.html
          grep -q 'zdcmnisxjgpmyvhwhkyl.supabase.co' /tmp/karakurt-deploy/index.html
          test $(wc -c < /tmp/karakurt-deploy/index.html) -gt 170000

      - name: Add same-origin KayKit proxy
        shell: bash
        run: |
          cat > /tmp/karakurt-deploy/api/kaykit.js <<'EOF'
          const ALLOWED = new Set(['Knight.glb','Rogue_Hooded.glb','Rogue.glb','Mage.glb','Barbarian.glb']);
          module.exports = async (req,res) => {
            try {
              const file = String(req.query.file || '');
              if (!ALLOWED.has(file)) return res.status(400).send('Bad asset');
              const url = 'https://raw.githubusercontent.com/KayKit-Game-Assets/KayKit-Character-Pack-Adventures-1.0/main/addons/kaykit_character_pack_adventures/Characters/gltf/' + encodeURIComponent(file);
              const r = await fetch(url, { headers: { 'User-Agent':'Karakurt-Online' } });
              if (!r.ok) return res.status(r.status).send('Asset fetch failed');
              const b = Buffer.from(await r.arrayBuffer());
              res.setHeader('Content-Type','model/gltf-binary');
              res.setHeader('Cache-Control','public, max-age=86400, s-maxage=604800, immutable');
              return res.status(200).send(b);
            } catch (e) {
              return res.status(500).send('Asset proxy error');
            }
          };
          EOF
          cat > /tmp/karakurt-deploy/vercel.json <<'EOF'
          {
            "$schema": "https://openapi.vercel.sh/vercel.json",
            "cleanUrls": false,
            "headers": [
              {"source":"/","headers":[{"key":"Cache-Control","value":"no-store, max-age=0"},{"key":"X-Karakurt-Engine","value":"v20.0-publish-direct"}]}
            ]
          }
          EOF
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > /tmp/karakurt-deploy/.vercel/project.json

      - name: Deploy production
        shell: bash
        run: |
          set -euo pipefail
          npm install --global vercel@59.3.0
          vercel deploy --prod --yes --force --cwd /tmp/karakurt-deploy --token "$VERCEL_TOKEN"
