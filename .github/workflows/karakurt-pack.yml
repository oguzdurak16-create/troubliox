name: Karakurt Engine Verify

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: karakurt-online
      - name: Verify engine chunks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('karakurt-online/v15-direct')
          html=''.join((root/f'chunk-{i:02d}.htmlpart').read_text(encoding='utf-8') for i in range(8))
          assert html.startswith('<!doctype html>')
          assert '</body></html>' in html
          assert 'Browser MMORPG v17' in html or 'ENGINE v17' in html
          print('engine bytes:',len(html.encode('utf-8')))
          PY
